name: Check X96 Mate

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Check board configuration
        run: |
          test -f config/boards/x96-mate.tvb
          grep 'BOARD_NAME="X96 Mate"' config/boards/x96-mate.tvb
          echo "Board configuration found"
